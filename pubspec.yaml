name: gymbro
description: A premium offline-first fitness exercise library app with 1300+ exercises.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.2.0
  
  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  
  # Image Loading & Caching
  cached_network_image: ^3.3.1
  
  # SVG Rendering
  flutter_svg: ^2.0.9
  
  # Animations
  flutter_animate: ^4.5.0
  
  # Typography
  google_fonts: ^6.1.0
  
  # Utilities
  uuid: ^4.3.3
  path_provider: ^2.1.2
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/
    - assets/svg/
    - assets/svg/body_parts/

